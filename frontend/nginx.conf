# Nginx vua phuc vu file tinh cua game, vua lam reverse proxy cho backend.
#
# Nho gop ve MOT origin duy nhat ma:
#   - khong can CORS
#   - cookie refresh la same-site that su
#   - chi phai dang ky MOT redirect URI voi Google

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chan lo phien ban nginx trong header Server
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API: dau '/' o cuoi proxy_pass la CO Y — no cat tien to /api truoc khi
    # chuyen tiep, vi route cua backend la /auth/... chu khong phai /api/auth/...
    #   trinh duyet goi  /api/auth/refresh
    #   backend nhan     /auth/refresh
    # Cookie van dung: trinh duyet luu theo duong dan NO THAY (/api/auth), va
    # settings.refresh_cookie_path tu suy ra dung tien to do tu BACKEND_URL.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # Tai nguyen co van tay trong ten file -> cache lau
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: moi duong dan khac deu tra ve index.html, neu khong thi
    # /auth/callback se 404 khi nguoi choi dang nhap xong quay ve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
